name: Deals aggregator

on:
  schedule:
    # 11:15 UTC = 7:15 AM Eastern in summer time (6:15 in winter). Either way it runs after the morning brief.
    - cron: "15 11 * * 1-5"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write      # needed to commit deals.json back to the repo

concurrency:
  group: deals
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: deals
    env:
      # Runners have no GPU, so a 3B model keeps generation to a few minutes
      LLM_MODEL: llama3.2:3b
      EMBED_MODEL: nomic-embed-text
      # The site serves the repo root, so deals.json goes there
      DEALS_OUT: ../deals.json
      DEALS_DB: data/chroma

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deals/requirements.txt

      - run: pip install -r requirements.txt pytest

      - name: Check the pipeline logic
        run: python -m pytest -q test_deals.py

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.LLM_MODEL }}-${{ env.EMBED_MODEL }}

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts a system service; stop it and run our own so
          # models are stored in ~/.ollama (the cached folder above)
          sudo systemctl stop ollama || true
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          until curl -s http://localhost:11434 > /dev/null; do sleep 1; done
          ollama pull "$LLM_MODEL"
          ollama pull "$EMBED_MODEL"

      - name: Build the deals page data
        run: python final.py

      - name: Commit deals.json and vector store
        run: |
          git config user.name "deals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$DEALS_OUT" "$DEALS_DB"
          git commit -m "Deals update $(date -u +%F)" || echo "Nothing new to commit"
          # The brief and price jobs push to this branch too, so catch up first
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            sleep 5
          done
